<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Calificaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 CALCULADORA DE CALIFICACIONES 📚</h1>
        
        <div class="info-box">
            <p>Nota mínima aprobatoria: <span class="highlight">7.0</span></p>
        </div>

        <div class="input-section">
            <h2>Ingresa las calificaciones de las 3 unidades:</h2>
            
            <div class="input-group">
                <label for="unidad1">Unidad 1:</label>
                <input type="number" id="unidad1" class="calificacion" min="0" max="10" step="0.1" placeholder="0-10">
            </div>

            <div class="input-group">
                <label for="unidad2">Unidad 2:</label>
                <input type="number" id="unidad2" class="calificacion" min="0" max="10" step="0.1" placeholder="0-10">
            </div>

            <div class="input-group">
                <label for="unidad3">Unidad 3:</label>
                <input type="number" id="unidad3" class="calificacion" min="0" max="10" step="0.1" placeholder="0-10">
            </div>

            <button onclick="calcularCalificacion()">Calcular 📊</button>
            <button onclick="limpiarCampos()" class="btn-secundario">Limpiar 🧹</button>
            <!-- Agrega esto justo después de abrir el container en cada programa -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <a href="../../index.html" 
                   style="display: inline-flex; align-items: center; gap: 5px; background: #f0f0f0; color: #667eea; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: 500; transition: all 0.3s ease;">
                    <span style="font-size: 1.2em;">←</span> Volver
                </a>
            </div>
        </div>

        <div id="resultado" class="result-section" style="display: none;">
            <h2>📊 RESULTADOS 📊</h2>
            
            <div class="result-grid">
                <div class="result-item">
                    <span class="result-label">Unidad 1:</span>
                    <span id="res-unidad1" class="result-value"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Unidad 2:</span>
                    <span id="res-unidad2" class="result-value"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Unidad 3:</span>
                    <span id="res-unidad3" class="result-value"></span>
                </div>
                <div class="result-item total">
                    <span class="result-label">Promedio final:</span>
                    <span id="promedio" class="result-value"></span>
                </div>
            </div>

            <div id="estatus" class="estatus-box">
                <!-- El estatus se mostrará aquí -->
            </div>
        </div>

        <div id="error" class="error-message" style="display: none;">
            <!-- Mensajes de error -->
        </div>
    </div>

    <script>
        function validarCalificacion(valor) {
            return !isNaN(valor) && valor >= 0 && valor <= 10;
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'block';
            errorDiv.textContent = mensaje;
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function calcularCalificacion() {
            // Obtener valores
            const unidad1 = parseFloat(document.getElementById('unidad1').value);
            const unidad2 = parseFloat(document.getElementById('unidad2').value);
            const unidad3 = parseFloat(document.getElementById('unidad3').value);
            
            // Validar que todos los campos tengan valores
            if (isNaN(unidad1) || isNaN(unidad2) || isNaN(unidad3)) {
                mostrarError('❌ Por favor, ingresa todas las calificaciones');
                return;
            }
            
            // Validar rango de calificaciones
            if (!validarCalificacion(unidad1) || !validarCalificacion(unidad2) || !validarCalificacion(unidad3)) {
                mostrarError('❌ Las calificaciones deben estar entre 0 y 10');
                return;
            }
            
            // Calcular promedio
            const promedio = (unidad1 + unidad2 + unidad3) / 3;
            
            // Mostrar resultados
            document.getElementById('res-unidad1').textContent = unidad1.toFixed(2);
            document.getElementById('res-unidad2').textContent = unidad2.toFixed(2);
            document.getElementById('res-unidad3').textContent = unidad3.toFixed(2);
            document.getElementById('promedio').textContent = promedio.toFixed(2);
            
            // Determinar estatus
            const estatusDiv = document.getElementById('estatus');
            estatusDiv.className = 'estatus-box';
            
            if (promedio >= 7) {
                if (promedio >= 8.5) {
                    estatusDiv.className += ' exento';
                    estatusDiv.innerHTML = '✅ ¡FELICIDADES! ESTÁS EXENTO';
                } else {
                    estatusDiv.className += ' aprobado';
                    estatusDiv.innerHTML = '✅ APROBADO (pero no exento)';
                }
            } else {
                estatusDiv.className += ' reprobado';
                estatusDiv.innerHTML = '❌ REPROBADO';
            }
            
            // Mostrar sección de resultados
            document.getElementById('resultado').style.display = 'block';
        }

        function limpiarCampos() {
            document.getElementById('unidad1').value = '';
            document.getElementById('unidad2').value = '';
            document.getElementById('unidad3').value = '';
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        // Permitir calcular con la tecla Enter
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calcularCalificacion();
            }
        });

        // Validación en tiempo real
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('.calificacion');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    let valor = parseFloat(this.value);
                    if (this.value !== '') {
                        if (valor > 10) this.value = 10;
                        if (valor < 0) this.value = 0;
                    }
                });
            });
        });
    </script>
</body>

</html>
